[stepper_x]
enable_pin: !PD2
step_pin: PC12
dir_pin: !PC11
microsteps: 32
full_steps_per_rotation: 200 
rotation_distance: 40
endstop_pin: NHK:gpio13
position_endstop: 120
position_max: 120
position_min: 0
homing_speed: 30
homing_retract_dist: 5
homing_positive_dir: true

[stepper_y]
enable_pin: !PC10
step_pin: PC9
dir_pin: !PC8
microsteps: 32
full_steps_per_rotation: 200 
rotation_distance: 40
endstop_pin: PC2
position_endstop: 117
position_max: 117
position_min: 0
homing_speed: 30
homing_retract_dist: 5
homing_positive_dir: true

[stepper_z]
step_pin: PD4
dir_pin: PD3
enable_pin: !PD7
microsteps: 32
rotation_distance: 8
endstop_pin: PC3
position_max: 125
position_min: -1.5
homing_speed: 40
second_homing_speed: 5
homing_retract_dist: 5

[extruder]
step_pin: NHK:gpio23
dir_pin: NHK:gpio24
enable_pin: !NHK:gpio25
full_steps_per_rotation: 200
microsteps: 16
nozzle_diameter: 0.400
filament_diameter: 1.750
rotation_distance: 4.64959505   #New RD = Old RD *(120-x)/100  #####  G1 E100 F100   ####
heater_pin: NHK:gpio9
sensor_pin: NHK:gpio29
pullup_resistor: 2200
sensor_type: ATC Semitec 104NT-4-R025H42G
#########   PID_CALIBRATE HEATER=extruder TARGET=245  PCF 25%    ###########
# Dragon: EPCOS 100K B57560G104F
# DragonFLY: EPCOS 100K B57560G104F  
# Phaetus Rapido: ATC Semitec 104NT-4-R025H42G
# Voron Revo: ATC Semitec 104GT-2
smooth_time: 2.0
min_temp: 0
max_temp: 280
max_power: 1.0
min_extrude_temp: 170
max_extrude_only_distance: 200
max_extrude_only_velocity: 120
max_extrude_cross_section: 5
pressure_advance: 0.04                                          
pressure_advance_smooth_time: 0.04

[verify_heater extruder]
max_error: 240
check_gain_time: 240
hysteresis: 5
heating_gain: 1