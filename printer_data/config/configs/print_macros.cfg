[gcode_macro PRINT_START]
gcode: 
    G28                                                   # Full home (XYZ)
    G90                                                   # Absolute position
    {% set BED_TEMP = params.BED|int %}
    {% set EXTRUDER_TEMP = params.EXTRUDER|int %}
    {% set CHAMBER_TEMP = params.CHAMBER|default("45")|int %}
    _status_homing                                        # Set LEDs to homing-mode
    RESPOND TYPE=command MSG='Turning on Chamber Filter'
    _chamber_filter_fan_on
    G1 X1 Y1 F3600 
    _status_heating                                       # Set LEDs to heating-mode
    M106 S255                                             # Turn on the PT-fan
    RESPOND TYPE=command MSG='Heating Bed'
    M190 S{BED_TEMP}
    RESPOND TYPE=command MSG='Cleaning Nozzle'
    Clean_Nozzle                                          # Clean nozzle macro   
    _status_heating                                       # Set LEDs to heating-mode
    RESPOND TYPE=command MSG='Heating Hotend'
    M107                                                  # Turn off partcooling fan
    M109 S{EXTRUDER_TEMP }        ; Set and wait for extruder temperature  
    RESPOND TYPE=command MSG='Priming Nozzle'
    LINE_PURGE                                            # Line Purge
    _status_printing                                      # Set LEDs to printing-mode
    RESPOND TYPE=command MSG='Printing'
    G90                                                   # Absolute coordinates
    M83                                                   # Relative extruder mode
    G92 E0                                                # Reset extruder

[gcode_macro END_PRINT]
gcode:
    _TOOLHEAD_PARK_PAUSE_CANCEL
    RESPOND TYPE=command MSG='Turning Off Heaters'
    TURN_OFF_HEATERS
    _chamber_heater_off
    M107                                                  # turn off fan
    _STATUS_READY
    UPDATE_DELAYED_GCODE ID=_chamber_filter_fan_off DURATION=300

[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
gcode:
    TURN_OFF_HEATERS
    CLEAR_PAUSE
    {% if printer.toolhead.homed_axes == "xyz" %}
        G91 ; Relative positioning
        G1 Z10 F3000 ; Move nozzle up
        G90 ; Absolute positioning
        G1 X0 Y117 F3000 ; Park nozzle (adjust to your printer)
    {% endif %}
    BASE_CANCEL_PRINT