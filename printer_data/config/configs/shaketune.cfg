[adxl345]
cs_pin: NHK:gpio27
spi_software_sclk_pin: NHK:gpio18
spi_software_mosi_pin: NHK:gpio20
spi_software_miso_pin: NHK:gpio19
axes_map: x,y,z

[input_shaper]
shaper_type_x = ei
shaper_freq_x = 96.2
shaper_type_y = mzv
shaper_freq_y = 68.8

[resonance_tester]
accel_chip: adxl345
probe_points:  60, 60, 20
sweeping_accel: 400
sweeping_period: 0

[shaketune]
result_folder: ~/printer_data/config/configs/ShakeTune_results
number_of_results_to_keep: 10
keep_raw_data: False
show_macros_in_webui: True
timeout: 600
measurements_chunk_size: 2
max_freq: 200
dpi: 300