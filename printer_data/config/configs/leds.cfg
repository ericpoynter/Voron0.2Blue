[neopixel tool_leds]
pin: NHK:gpio7
chain_count: 3
color_order: GRBW
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 1.0
initial_WHITE: 0.0

[neopixel skirt_leds]
pin: PF10
chain_count: 3
color_order: GRB
initial_RED: 1.0
initial_GREEN: 0.0
initial_BLUE: 0.0
#LEDs
# 1 Left front skirt
# 2 Right front skirt
# 3 Bed Led


[gcode_macro _led_vars]
variable_colors: {
        'logo': { # Colors for logo states
            'heating': {'r': 1.0, 'g': 0.0, 'b': 0.0, 'w': 0.0},
            'printing': {'r': 0.0, 'g': 0.0, 'b': 1.0, 'w': 0.0},
            'standby': {'r': 0.0, 'g': 0.0, 'b': 1.0, 'w': 0.0},
            
        },
        'nozzle': { # Colors for nozzle states
            'on': {'r': 0.0, 'g': 0.0, 'b': 0.0, 'w':1.0}
        }
    }
variable_logo_led_name:         "tool_leds" 
variable_logo_idx:              "3" 
variable_nozzle_led_name:       "tool_leds"
variable_nozzle_idx:            "1,2"
gcode:
    # This section is required.  Do Not Delete.

[gcode_macro _set_leds]
gcode:
    {% set red = params.RED|default(0)|float %}
    {% set green = params.GREEN|default(0)|float %}
    {% set blue = params.BLUE|default(0)|float %}
    {% set white = params.WHITE|default(0)|float %}
    {% set led = params.LED|string %}
    {% set idx = (params.IDX|string).split(',') %}
    {% set transmit_last = params.TRANSMIT|default(1) %}

    {% for led_index in idx %}
        {% set transmit=transmit_last if loop.last else 0 %}
        set_led led={led} red={red} green={green} blue={blue} white={white} index={led_index} transmit={transmit}
    {% endfor %}

[gcode_macro _set_leds_by_name]
gcode:
    {% set leds_name = params.LEDS %}
    {% set color_name = params.COLOR %}
    {% set color = printer["gcode_macro _led_vars"].colors[leds_name][color_name] %}
    {% set led = printer["gcode_macro _led_vars"][leds_name + "_led_name"] %}
    {% set idx = printer["gcode_macro _led_vars"][leds_name + "_idx"] %}
    {% set transmit = params.TRANSMIT|default(1) %}

    _set_leds led={led} red={color.r} green={color.g} blue={color.b} white={color.w} idx="{idx}" transmit={transmit}

[gcode_macro _set_logo_leds]
gcode:
    {% set red = params.RED|default(0)|float %}
    {% set green = params.GREEN|default(0)|float %}
    {% set blue = params.BLUE|default(0)|float %}
    {% set white = params.WHITE|default(0)|float %}
    {% set led = printer["gcode_macro _led_vars"].logo_led_name %}
    {% set idx = printer["gcode_macro _led_vars"].logo_idx %}
    {% set transmit=params.TRANSMIT|default(1) %}

    _set_leds led={led} red={red} green={green} blue={blue} white={white} idx="{idx}" transmit={transmit}

[gcode_macro _set_nozzle_leds]
gcode:
    {% set red = params.RED|default(0)|float %}
    {% set green = params.GREEN|default(0)|float %}
    {% set blue = params.BLUE|default(0)|float %}
    {% set white = params.WHITE|default(0)|float %}
    {% set led = printer["gcode_macro _led_vars"].nozzle_led_name %}
    {% set idx = printer["gcode_macro _led_vars"].nozzle_idx %}
    {% set transmit=params.TRANSMIT|default(1) %}

    _set_leds led={led} red={red} green={green} blue={blue} white={white} idx="{idx}" transmit={transmit}

[gcode_macro _set_nozzle_leds_on]
gcode:
    {% set transmit=params.TRANSMIT|default(1) %}
    _set_leds_by_name leds="nozzle" color="on" transmit={transmit}

[gcode_macro _status_heating]
gcode:
    _set_leds_by_name leds="logo" color="heating" transmit=0

[gcode_macro _status_printing]
gcode:
    _set_leds_by_name leds="logo" color="printing" transmit=0
    _set_nozzle_leds_on

[gcode_macro _status_ready]
gcode:
    _set_leds_by_name leds="logo" color="standby" transmit=0


[led_effect busy]
autostart: false
frame_rate: 24
leds:
    neopixel:skirt_leds
layers:
      breathing  3 1 top (1,0,0)

[led_effect cleaning]
autostart: false
frame_rate: 24
leds:
    neopixel:skirt_leds
layers:
      breathing  3 1 top (0.0, 0.02, 0.5)

[led_effect heating]
autostart: false
frame_rate: 24
leds:
    neopixel:skirt_leds
layers:
      breathing  2 1 top (1, 0, 0)

[led_effect cooling]
autostart: false
frame_rate: 24
leds:
    neopixel:skirt_leds
layers:
      breathing  2 1 top (0, 0, 1)

[led_effect homing]
autostart: false
frame_rate: 24
leds:
    neopixel:skirt_leds
layers:
      breathing  3 1 top (1, 0, 0)

[led_effect printing]
autostart: false
frame_rate: 24
leds:
    neopixel:skirt_leds
layers:
      gradient  0.3  1 add (0.3, 0.0, 0.0),(0.3, 0.3, 0.0),(0.3, 0.1, 0.0)

[led_effect standby]
autostart: false
frame_rate: 24
leds:
    neopixel:skirt_leds
layers:
      breathing  3 1 top (0.01, 0.01, 0.01)

[led_effect part_ready]
autostart: false
frame_rate: 24
leds:
    neopixel:skirt_leds
layers:
      breathing  3 1 top (0.0, 1.0, 0.0)
    
[led_effect sb_critical_error]
autostart:  false
frame_rate: 24
run_on_error: true
leds:
    neopixel:skirt_leds
layers:
     strobe         1  1.5   add        (1.0,  1.0, 1.0)
     breathing      2  0     difference (0.95, 0.0, 0.0)
     static         1  0     top        (1.0,  0.0, 0.0)

[led_effect front_status]
autostart: true
frame_rate: 24
leds:    
    neopixel:skirt_leds
layers:
     static         1  0     top        (1.0,  0.0, 0.0)

[led_effect set_leds]
autostart: false
frame_rate: 24
leds:
    neopixel:skirt_leds
layers:
      static         0  0     top        (1.0,  1.0, 1.0)

[gcode_macro _status_off]
gcode:
     STOP_LED_EFFECTS
     _set_nozzle_leds_on

[gcode_macro _status_ready]
gcode:
     STOP_LED_EFFECTS
     _set_nozzle_leds_on

[gcode_macro _status_part_ready]
gcode:
     STOP_LED_EFFECTS
     SET_LED_EFFECT EFFECT=part_ready
     _set_nozzle_leds_on
     
[gcode_macro _status_busy]
gcode:
     STOP_LED_EFFECTS
     SET_LED_EFFECT EFFECT=busy
     _set_nozzle_leds_on

[gcode_macro _status_heating]
gcode:
     STOP_LED_EFFECTS
     SET_LED_EFFECT EFFECT=heating   
     _set_nozzle_leds_on

[gcode_macro _status_cooling]
gcode:
     STOP_LED_EFFECTS
     SET_LED_EFFECT EFFECT=cooling
     _set_nozzle_leds_on

[gcode_macro _status_homing]
gcode:
     STOP_LED_EFFECTS
     SET_LED_EFFECT EFFECT=homing
     _set_nozzle_leds_on

[gcode_macro _status_cleaning]
gcode:
     STOP_LED_EFFECTS
     SET_LED_EFFECT EFFECT=cleaning
     _set_nozzle_leds_on

[gcode_macro _status_printing]
gcode:
     STOP_LED_EFFECTS
     SET_LED_EFFECT EFFECT=printing   
     _set_nozzle_leds_on