[printer Voron 0.2 Blue]
moonraker_host: 192.168.1.22
moonraker_port: 7125
moonraker_api_key: a833e1c2b57a401890a0bbf51f36c64b
z_babystep_values: 0.01, 0.05
extrude_distances: 10, 25, 50
extrude_speeds: 1, 2, 5, 10
move_distances: 5, 10, 50, 100, 200

[preheat ABS/ASA]
extruder: 220
heater_bed: 110
heater_generic: 70
gcode:
  SET_IDLE_TIMEOUT TIMEOUT=7200
  _chamber_filter_fan_on

[preheat PLA]
extruder: 190
heater_bed: 60
gcode:
      SET_IDLE_TIMEOUT TIMEOUT=7200
      _chamber_filter_fan_on

[preheat Heatsoak]
extruder: 150
heater_bed: 120
heater_generic: 80
gcode:
      SET_IDLE_TIMEOUT TIMEOUT=7200
      _chamber_filter_fan_on
      
[preheat cooldown]
gcode:
	M107
